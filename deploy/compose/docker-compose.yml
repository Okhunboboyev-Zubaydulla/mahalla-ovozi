services:
  postgres:
    image: postgres:18-alpine
    container_name: mahalla-ovozi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mahalla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahalla_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mahalla_ovozi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mahalla_user} -d ${POSTGRES_DB:-mahalla_ovozi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  userbot:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    container_name: mahalla-ovozi-userbot
    restart: unless-stopped
    command: ["pnpm", "--filter", "@mahalla-ovozi/backend", "exec", "node", "--import", "tsx/esm", "src/entrypoints/userbot.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mahalla_user}:${POSTGRES_PASSWORD:-mahalla_dev_password}@postgres:5432/${POSTGRES_DB:-mahalla_ovozi}
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  pgdata:
