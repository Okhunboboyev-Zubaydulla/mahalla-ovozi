name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test & E2E Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mahalla_user
          POSTGRES_PASSWORD: mahalla_ci_password
          POSTGRES_DB: mahalla_ovozi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahalla_user -d mahalla_ovozi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mahalla_user:mahalla_ci_password@localhost:5432/mahalla_ovozi_test
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run integration & unit tests
        run: pnpm test

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mahalla-ovozi/web exec playwright install --with-deps

      - name: Install Playwright OS dependencies only (on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mahalla-ovozi/web exec playwright install-deps

      - name: Run Playwright browser tests
        run: pnpm test:e2e
